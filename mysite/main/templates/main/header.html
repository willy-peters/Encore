      .nav-background {

      .no-border {
        border: none;
      }

        transition: all 0.3s ease;

      }

      .image-size {

      }

        text-decoration: none;
        color: rgb(77, 77, 77);
      }

      .page-item > a:hover {
        color: blue;
      }

      .modal-body form input,
      .modal-body form select,
      .modal-body form textarea {
        width: 100% !important;
      }
    </style>
